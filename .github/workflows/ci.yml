name: Vertexon LMS-AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Build & Test Backend
        run: |
          cd backend
          npm ci
          npx tsc --noEmit

      - name: Build & Test Frontend
        run: |
          cd frontend
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Test AI Service
        run: |
          cd ai-service
          pip install -r requirements.txt
          python -m py_compile app/main.py
