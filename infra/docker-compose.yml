version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vertexon_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms123}
      POSTGRES_DB: ${POSTGRES_DB:-lms_ai}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vertexon_redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: vertexon_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: vertexon_backend
    environment:
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: vertexon_lms_super_secret_jwt_key_2026
      JWT_REFRESH_SECRET: vertexon_lms_super_secret_refresh_key_2026
      DATABASE_URL: postgresql://lms:lms123@postgres:5432/lms_ai
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: vertexon_ai_service
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: postgresql://lms:lms123@postgres:5432/lms_ai
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: vertexon_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
